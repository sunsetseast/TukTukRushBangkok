name: Real-scale Bangkok geography
on:
  pull_request:
    paths:
      - 'artifacts/tuk-tuk-rush/**'
      - 'scripts/geography/**'
      - 'data/bangkok/real-scale/**'
      - '.github/workflows/real-geography.yml'
  workflow_dispatch:
jobs:
  geographic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PORT: '24801'
      BASE_PATH: '/'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r scripts/geography/requirements.txt
      - name: Reproduce runtime offline and validate source geometry
        run: |
          python scripts/geography/import_bangkok.py
          pnpm --filter @workspace/tuk-tuk-rush geography:pack
          # Source + gameplay assets must round-trip unchanged. The old
          # tracked compiled/*.bin.gz artifacts were retired by PR54 in favor
          # of generated, gitignored compiled/*.bin.pack; rebuilding correctly
          # removes the obsolete files. Do not misclassify that deletion as
          # a change in canonical geography.
          git diff --exit-code -- data/bangkok/real-scale/manifest.v1.json data/bangkok/real-scale/buildings-report.v1.json data/bangkok/real-scale/building-exceptions.v1.json.gz artifacts/tuk-tuk-rush/public/assets/geography/ ':(exclude)artifacts/tuk-tuk-rush/public/assets/geography/compiled/**'
          # The replacement compiled geometry must still be present and tested.
          pnpm --filter @workspace/tuk-tuk-rush exec node --import tsx scripts/check-geographic-compiled-delivery.ts

          python scripts/geography/check_data.py
          python scripts/geography/check_stations.py
          python scripts/geography/check_buildings.py
      - run: pnpm --filter @workspace/tuk-tuk-rush typecheck
      - run: pnpm --filter @workspace/tuk-tuk-rush test:real-geography
      - run: pnpm --filter @workspace/tuk-tuk-rush test:geographic-streaming
      - run: pnpm --filter @workspace/tuk-tuk-rush test:geographic-buildings
      - run: pnpm --filter @workspace/tuk-tuk-rush test:geographic-gameplay
      - run: pnpm --filter @workspace/tuk-tuk-rush test:chinatown-completion
      - run: pnpm --filter @workspace/tuk-tuk-rush test:historic-fidelity
      - run: pnpm --filter @workspace/tuk-tuk-rush build
      - run: pnpm --filter @workspace/tuk-tuk-rush exec playwright install --with-deps chromium
      - name: Install WebKit for gzip transport regression
        run: pnpm --filter @workspace/tuk-tuk-rush exec playwright install --with-deps webkit
      - name: Verify mapped Thai traffic signs, moving vehicle art, and mobile UI toggle
        run: node scripts/browser-geographic-traffic.mjs
        working-directory: artifacts/tuk-tuk-rush
      - run: node scripts/browser-geographic-streaming.mjs
        working-directory: artifacts/tuk-tuk-rush
      - name: Capture actual Bangkok OSM-tagged Thai road sign art and bilingual street names
        run: node scripts/browser-thai-road-signage.mjs
        working-directory: artifacts/tuk-tuk-rush
      - name: Verify opt-in mobile performance overlay (software WebGL only)
        run: node scripts/browser-geographic-performance.mjs
        working-directory: artifacts/tuk-tuk-rush
      - name: Verify packed geography delivery on WebKit
        run: node scripts/browser-geographic-gzip-webkit.mjs
        working-directory: artifacts/tuk-tuk-rush
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geographic-proof
          path: |
            docs/qa/expanded-geography/
            docs/qa/geographic-gameplay/
            docs/qa/geographic-buildings/
            docs/qa/geographic-mobile-performance/
            docs/qa/geographic-traffic/
            docs/qa/thai-road-signage/
          retention-days: 30
