name: Import Real Bangkok Driving Streets
on:
  push:
    branches: [game/bangkok-city-adventure]
    paths: ['.github/workflows/bangkok-roads.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game/bangkok-city-adventure
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OSM PBF geometry reader
        run: python -m pip install 'osmium>=4,<5'
      - name: Inspect university's published Bangkok OSM road graph
        run: |
          git clone --depth 1 https://github.com/Todai-ops/Planarization-in-Urban-Road-Networks.git /tmp/bangkok-osm-graph
          python -m pip install pandas openpyxl
          python - <<'PY'
          import pandas as pd
          for name in ('Bangkok_nodes_osm.xlsx','Bangkok_edges_osm.xlsx'):
              f='/tmp/bangkok-osm-graph/'+name
              d=pd.read_excel(f,nrows=4)
              print(name,'columns=',d.columns.tolist())
              print(d.to_string(index=False,max_colwidth=90))
          PY
      - name: Extract true OSM road data from published research
        run: python artifacts/tuk-tuk-rush/scripts/extract-bangkok-xlsx.py /tmp/bangkok-osm-graph
      - name: Commit generated licensed static road geometry to draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/tuk-tuk-rush/public/maps/imported/*.geojson artifacts/tuk-tuk-rush/public/maps/imported/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Import actual OSM Bangkok roads, river ways and bridges for playable tour"
            git push origin HEAD:game/bangkok-city-adventure
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bangkok-osm-geography
          path: artifacts/tuk-tuk-rush/public/maps/imported/
          if-no-files-found: warn
