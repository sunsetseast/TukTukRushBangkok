name: Import Real Bangkok Driving Streets
on:
  push:
    branches: [game/bangkok-city-adventure]
    paths: ['.github/workflows/bangkok-roads.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game/bangkok-city-adventure
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OSM PBF geometry reader
        run: python -m pip install 'osmium>=4,<5'
      - name: Download published Bangkok OSM extract from BBBike
        run: |
          curl -fL --retry 3 --connect-timeout 25 --max-time 260 \
            -o /tmp/Bangkok.osm.pbf \
            https://download.bbbike.org/osm/bbbike/Bangkok/Bangkok.osm.pbf
          test $(stat -c%s /tmp/Bangkok.osm.pbf) -gt 10000000
      - name: Extract true OSM roads, bridges and waterways
        run: python artifacts/tuk-tuk-rush/scripts/extract-bangkok-pbf.py /tmp/Bangkok.osm.pbf
      - name: Commit generated licensed static road geometry to draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/tuk-tuk-rush/public/maps/imported/*.geojson artifacts/tuk-tuk-rush/public/maps/imported/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Import actual OSM Bangkok roads, river ways and bridges for playable tour"
            git push origin HEAD:game/bangkok-city-adventure
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bangkok-osm-geography
          path: artifacts/tuk-tuk-rush/public/maps/imported/
          if-no-files-found: warn
