name: Yaowarat Renaissance visual comparison
on:
  push:
    branches: ['feature/yaowarat-renaissance-pr62']
    paths: ['artifacts/tuk-tuk-rush/**', '.github/workflows/yaowarat-renaissance.yml']
  workflow_dispatch:
concurrency:
  group: renaissance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rendered-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: write, actions: read}
    env: {PORT: "24862", BASE_PATH: "/"}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: artifacts/tuk-tuk-rush/public/assets/geography/compiled
          key: geography-compiled-${{ hashFiles('artifacts/tuk-tuk-rush/scripts/compile-geographic-buildings.ts', 'artifacts/tuk-tuk-rush/scripts/geographic-building-authoring.ts', 'data/bangkok/real-scale/clearance*') }}
      - name: Prepare pinned derived assets
        working-directory: artifacts/tuk-tuk-rush
        run: |
          node --import tsx scripts/pack-geographic-road-rules.ts
          node --import tsx scripts/compile-geographic-buildings.ts
          node --import tsx scripts/pack-geographic-traffic-controls.ts
          node --import tsx scripts/prepare-geographic-browser-assets.ts
      - name: TypeScript, focused source/finish regressions and production build
        working-directory: artifacts/tuk-tuk-rush
        run: |
          pnpm exec tsc -p tsconfig.json --noEmit
          node --import tsx scripts/check-geographic-finishes.ts
          node --import tsx scripts/check-geographic-openings.ts
          pnpm exec vite build
      - run: timeout 240 pnpm --filter @workspace/tuk-tuk-rush exec playwright install --with-deps chromium
      - name: Reuse verified immutable original and PR61 reference renders
        if: ${{ hashFiles('docs/qa/yaowarat-renaissance/views/original-night.png') == '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42527618107
          name: yaowarat-renaissance-rendered-evidence
          path: /tmp/renaissance-reference
      - name: Keep reference images and camera records
        if: ${{ hashFiles('docs/qa/yaowarat-renaissance/views/original-night.png') == '' }}
        run: |
          mkdir -p docs/qa/yaowarat-renaissance/views
          cp /tmp/renaissance-reference/views/original-*.png /tmp/renaissance-reference/views/baseline-*.png docs/qa/yaowarat-renaissance/views/
          cp /tmp/renaissance-reference/original-captures.json /tmp/renaissance-reference/baseline-captures.json docs/qa/yaowarat-renaissance/
      - name: Condensed reference and pinned PR61 baseline
        working-directory: artifacts/tuk-tuk-rush
        run: |
          GEOGRAPHY_QA_BASELINE_REF=b1ebccdf536a6b72a0cf8afb45bcdcd409a6d735 node scripts/browser-vite-server.mjs 24862 > /tmp/renaissance-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID"' EXIT
          for attempt in $(seq 1 60); do curl -sf http://127.0.0.1:24862/ > /dev/null && break; sleep 1; done
          if [ ! -f ../../docs/qa/yaowarat-renaissance/views/original-night.png ]; then
          QA_MODE=original timeout 240 node scripts/browser-renaissance.mjs
          QA_MODE=baseline QA_SELECT=01,02,03,04,05,06,07,09,10,11,12,13,16,18,19,20,21 timeout 300 node scripts/browser-renaissance.mjs
          fi
      - name: Current implementation
        if: ${{ !cancelled() }}
        working-directory: artifacts/tuk-tuk-rush
        run: |
          node scripts/browser-vite-server.mjs 24863 > /tmp/renaissance-final-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID"' EXIT
          for attempt in $(seq 1 60); do curl -sf http://127.0.0.1:24863/ > /dev/null && break; sleep 1; done
          QA_MODE=final QA_PORT=24863 timeout 360 node scripts/browser-renaissance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yaowarat-renaissance-rendered-evidence
          path: docs/qa/yaowarat-renaissance/
          retention-days: 30
      - name: Preserve actual renders on this draft branch
        if: ${{ success() && github.ref == 'refs/heads/feature/yaowarat-renaissance-pr62' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qa/yaowarat-renaissance/
          if ! git diff --cached --quiet; then
            git commit -m 'PR62 evidence: preserve actual baseline and current WebGL renders'
            git push origin HEAD:feature/yaowarat-renaissance-pr62
          fi
