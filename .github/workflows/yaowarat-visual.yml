name: Yaowarat art inspection

on:
  pull_request:
    paths:
      - 'artifacts/tuk-tuk-rush/**'
      - 'docs/graphics/signature-corridor/**'
      - '.github/workflows/yaowarat-visual.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PORT: '24177'
      BASE_PATH: '/'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/tuk-tuk-rush run typecheck
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:signature
      - run: pnpm --filter @workspace/tuk-tuk-rush run build
      - run: pnpm --filter @workspace/tuk-tuk-rush exec playwright install --with-deps chromium
      - name: Capture actual WebGL frames
        run: |
          pnpm --filter @workspace/tuk-tuk-rush exec vite --config vite.config.ts --host 127.0.0.1 --port 24177 > /tmp/tuktuk-vite.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://localhost:24177/ >/dev/null; then break; fi
            sleep 1
          done
          GAME_URL=http://localhost:24177/?world=chinatown pnpm --filter @workspace/tuk-tuk-rush exec node scripts/capture-signature.mjs
          GAME_URL=http://localhost:24177/ pnpm --filter @workspace/tuk-tuk-rush exec node scripts/capture-bangkok.mjs
      - name: Regress LOOK, map and restart camera return
        run: pnpm --filter @workspace/tuk-tuk-rush exec node scripts/check-camera-roundtrip.mjs
        env:
          QA_OUT: /tmp/tuktuk-camera-regression
      - name: Verify career rewards, persistence and responsive menus
        run: pnpm --filter @workspace/tuk-tuk-rush exec node scripts/browser-career.mjs
        env:
          QA_OUT: /tmp/tuktuk-career-regression
      - name: Verify cinematic title and Detailed context recovery
        run: pnpm --filter @workspace/tuk-tuk-rush exec node scripts/browser-cinematic.mjs
        env:
          QA_OUT: /tmp/tuktuk-cinematic-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yaowarat-webgl-screenshots
          path: generated-artifacts/yaowarat-signature/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-bangkok-webgl-qa
          path: generated-artifacts/compact-bangkok/
          if-no-files-found: warn
