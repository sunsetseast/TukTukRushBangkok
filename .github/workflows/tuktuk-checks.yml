name: Tuk Tuk Rush graphics checks

on:
  push:
    branches:
      - graphics/authentic-cartoon-bangkok
  pull_request:
    paths:
      - 'artifacts/tuk-tuk-rush/**'
      - '.github/workflows/tuktuk-checks.yml'

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: '24177'
      BASE_PATH: '/'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/tuk-tuk-rush run typecheck
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:real-architecture
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:city-fabric
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:cinematic
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:startup
      - run: pnpm --filter @workspace/tuk-tuk-rush run build
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:landmark-quality
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:landmark-accuracy
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:historic-core
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:historic-fidelity
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:master-plan
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:open-bangkok
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:definitive
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:cityscapes
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:environment
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:career
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:corrections
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:graphics-foundation
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:interface
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:bangkok
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:waterfront-clearance
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:waterfront-drives
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:gameplay
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:street-life
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:roadside
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:signature
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:sign-layers
      - run: pnpm --filter @workspace/tuk-tuk-rush run test:assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: waterfront-controller-certification
          path: |
            docs/qa/waterfront-certification/static-routes.json
            docs/qa/waterfront-certification/validation/clearance.json
          retention-days: 30
