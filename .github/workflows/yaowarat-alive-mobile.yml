name: Yaowarat Alive mobile and WebKit regressions
on:
  push:
    branches: ['feature/yaowarat-alive-pr61']
    paths: ['.github/workflows/yaowarat-alive-mobile.yml']
  workflow_dispatch:
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env: {PORT: '24830', BASE_PATH: '/'}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: artifacts/tuk-tuk-rush/public/assets/geography/compiled
          key: geography-compiled-${{ hashFiles('artifacts/tuk-tuk-rush/scripts/compile-geographic-buildings.ts', 'artifacts/tuk-tuk-rush/scripts/geographic-building-authoring.ts', 'data/bangkok/real-scale/clearance*') }}
      - name: Prepare derived browser assets
        working-directory: artifacts/tuk-tuk-rush
        run: |
          node --import tsx scripts/pack-geographic-road-rules.ts
          node --import tsx scripts/compile-geographic-buildings.ts
          node --import tsx scripts/pack-geographic-traffic-controls.ts
          node scripts/prepare-geographic-qa-fixtures.mjs
          node --import tsx scripts/prepare-geographic-browser-assets.ts
      - run: timeout 240 pnpm --filter @workspace/tuk-tuk-rush exec playwright install --with-deps chromium webkit
      - name: Touch controls, map, pause, recovery, original compressed world
        working-directory: artifacts/tuk-tuk-rush
        run: timeout 480 node scripts/browser-geographic-consolidation.mjs
      - name: WebKit payload decoding and HTTP HTML fallback
        if: ${{ !cancelled() }}
        working-directory: artifacts/tuk-tuk-rush
        run: |
          node scripts/browser-geographic-gzip-webkit.mjs
          node scripts/browser-geographic-spa-fallback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yaowarat-alive-mobile
          path: |
            docs/qa/geographic-consolidation/
            docs/qa/geographic-mobile-performance/webkit-gzip.json
          retention-days: 30
