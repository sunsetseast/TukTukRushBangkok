name: Import verified Bangkok traffic signs and turn restrictions
on:
  pull_request:
    paths:
      - 'scripts/geography/import_traffic_controls.py'
      - '.github/workflows/import-geographic-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check osmium
      - name: Download newer real OSM signs as an explicitly versioned source, independent of immutable road geometry
        run: |
          curl -fL --retry 3 --connect-timeout 20 \
            'https://download.geofabrik.de/asia/thailand-latest.osm.pbf' -o /tmp/thailand-controls-current.osm.pbf
      - name: Extract actual signals, signs, turn restrictions by source node/relation ID
        run: python scripts/geography/import_traffic_controls.py --pbf /tmp/thailand-261024.osm.pbf
      - uses: actions/upload-artifact@v4
        with:
          name: bangkok-verified-traffic-control-source
          path: data/bangkok/real-scale/traffic-controls.v1.json
          retention-days: 30
      - name: Emit separately verifiable compressed extraction for GitHub PR source commit
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib
          source=pathlib.Path('data/bangkok/real-scale/traffic-controls.v1.json').read_bytes()
          zipped=gzip.compress(source,mtime=0)
          encoded=base64.b64encode(zipped).decode()
          print('BANGKOK_CONTROL_ARCHIVE_BEGIN', len(source),hashlib.sha256(source).hexdigest(),flush=True)
          for index in range(0,len(encoded),3600):
              print('BANGKOK_CTRL_CHUNK_' + str(index//3600).zfill(4) + '=' + encoded[index:index+3600],flush=True)
          print('BANGKOK_CONTROL_ARCHIVE_END',len(encoded),flush=True)
          PY
