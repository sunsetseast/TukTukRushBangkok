name: Canonical Bangkok approval and benchmark gates
on:
  pull_request:
    paths:
      - 'artifacts/tuk-tuk-rush/src/**'
      - 'artifacts/tuk-tuk-rush/scripts/**'
      - 'data/bangkok/**'
      - '.github/workflows/city-blueprint.yml'
  workflow_dispatch:
jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/tuk-tuk-rush typecheck
      - run: pnpm --filter @workspace/tuk-tuk-rush test:city-blueprint
      - run: pnpm --filter @workspace/tuk-tuk-rush test:river-geography
      - run: pnpm --filter @workspace/tuk-tuk-rush test:river-drives
      - run: pnpm --filter @workspace/tuk-tuk-rush test:cinematic
      - run: pnpm --filter @workspace/tuk-tuk-rush test:master-plan
      - run: pnpm --filter @workspace/tuk-tuk-rush test:historic-fidelity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-blueprint-certification
          path: docs/qa/world-blueprint/certification.json
          retention-days: 30
