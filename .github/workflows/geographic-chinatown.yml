name: Geographic Chinatown visual certification
on:
  pull_request:
    paths:
      - 'artifacts/tuk-tuk-rush/**'
      - '.github/workflows/geographic-chinatown.yml'
  workflow_dispatch:
concurrency:
  group: chinatown-${{ github.ref }}
  cancel-in-progress: true
jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORT: '24860'
      BASE_PATH: '/'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: artifacts/tuk-tuk-rush/public/assets/geography/compiled
          key: geography-compiled-${{ hashFiles('artifacts/tuk-tuk-rush/scripts/compile-geographic-buildings.ts', 'artifacts/tuk-tuk-rush/scripts/geographic-building-authoring.ts', 'data/bangkok/real-scale/clearance*') }}
      - name: Compile derived assets once without reimporting the map
        run: |
          pnpm --filter @workspace/tuk-tuk-rush exec node --import tsx scripts/pack-geographic-road-rules.ts
          pnpm --filter @workspace/tuk-tuk-rush exec node --import tsx scripts/compile-geographic-buildings.ts
          pnpm --filter @workspace/tuk-tuk-rush exec node --import tsx scripts/pack-geographic-traffic-controls.ts
          pnpm --filter @workspace/tuk-tuk-rush exec node --import tsx scripts/prepare-geographic-browser-assets.ts
      - run: pnpm --filter @workspace/tuk-tuk-rush typecheck
      - run: pnpm --filter @workspace/tuk-tuk-rush exec node --import tsx scripts/check-geographic-chinatown.ts
      - run: pnpm --filter @workspace/tuk-tuk-rush exec node --import tsx scripts/check-geographic-worker.ts
      - run: pnpm --filter @workspace/tuk-tuk-rush exec node --import tsx scripts/check-geographic-landmark-cache.ts
      - run: pnpm --filter @workspace/tuk-tuk-rush test:geographic-streaming
      - run: pnpm --filter @workspace/tuk-tuk-rush test:geographic-gameplay
      - run: pnpm --filter @workspace/tuk-tuk-rush test:geographic-asset-delivery
      - run: pnpm --filter @workspace/tuk-tuk-rush test:geographic-traffic
      - run: pnpm --filter @workspace/tuk-tuk-rush test:thai-road-signage
      - run: pnpm --filter @workspace/tuk-tuk-rush exec vite build
      - run: timeout 300 pnpm --filter @workspace/tuk-tuk-rush exec playwright install --with-deps chromium webkit
      - name: PR59 baseline at identical source camera positions
        working-directory: artifacts/tuk-tuk-rush
        env:
          GEOGRAPHY_QA_BASELINE_REF: e2afddf273ad4bfd752180bffa0b8422ca242be7
        run: timeout 420 node scripts/browser-geographic-chinatown.mjs
      - name: Genuine rendered visual evidence and matched driving
        if: always()
        working-directory: artifacts/tuk-tuk-rush
        run: timeout 600 node scripts/browser-geographic-chinatown.mjs
      - name: Safari asset fallback
        if: always()
        working-directory: artifacts/tuk-tuk-rush
        run: node scripts/browser-geographic-spa-fallback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geographic-chinatown-evidence
          path: docs/qa/geographic-chinatown/
          retention-days: 30
